[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openlode"
version = "1.0.0"
description = "Broadband (HFC) plant design: RF levels, distortion cascade, powering and reports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["hfc", "catv", "broadband", "rf", "network-design", "docsis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Telecommunications Industry",
]
dependencies = []

[project.scripts]
lode = "lode.cli:main"

[tool.setuptools.packages.find]
include = ["lode*"]

[tool.setuptools.package-data]
"lode.web" = ["static/*"]
