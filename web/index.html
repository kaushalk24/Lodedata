<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HFC Plant Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* One committed look: a dark engineering console, like the DOS-era design screens. */
  :root {
    color-scheme: dark;
    --ground: #050d22;
    --screen: #081533;
    --chrome: #0f1f45;
    --chrome-hi: #173063;
    --line: #20386c;
    --line-soft: #172b57;
    --text: #dfe7ff;
    --dim: #8497c8;
    --level: #6fd6ff;
    --auto: #9be58f;
    --warn: #ffd166;
    --bad: #ff6b6b;
    --sel: #1b3777;
    --on-warn: #1d1600;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; box-sizing: border-box; padding-inline: 16px; padding-block: 12px;
    background: var(--ground); color: var(--text); font: 13px/1.4 var(--sans);
  }
  button, input { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--warn); outline-offset: -2px; }

  .app {
    height: 100%; min-width: 0; display: grid;
    grid-template-rows: auto auto auto minmax(0, 1fr) auto auto;
    background: var(--screen); border: 1px solid var(--line);
  }

  /* menu bar */
  .menubar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; padding: 2px 6px; background: var(--chrome); border-bottom: 1px solid var(--line); }
  .brand { font: 600 12px var(--mono); letter-spacing: .1em; color: var(--warn); padding-right: 10px; }
  .menus { display: flex; flex-wrap: wrap; }
  .menu { position: relative; }
  .menu > button { background: none; border: 0; padding: 4px 10px; cursor: pointer; font-weight: 500; }
  .menu > button:hover { background: var(--chrome-hi); }
  .dropdown { position: absolute; top: 100%; left: 0; z-index: 30; min-width: 240px; padding: 4px 0; background: var(--chrome); border: 1px solid var(--line); box-shadow: 0 10px 28px rgb(0 0 0 / .5); }
  .dropdown button { display: flex; justify-content: space-between; gap: 18px; width: 100%; padding: 5px 14px; background: none; border: 0; text-align: left; cursor: pointer; }
  .dropdown button:hover { background: var(--sel); }
  .dropdown kbd { font: 11px var(--mono); color: var(--dim); }
  .doc { margin-left: auto; font: 12px var(--mono); color: var(--dim); }

  /* numbered toolbar */
  .toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; background: var(--chrome); border-bottom: 1px solid var(--line); }
  .toolbar button { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 10px; background: var(--chrome-hi); border: 1px solid var(--line); cursor: pointer; font-size: 12px; font-weight: 500; }
  .toolbar button b { font: 600 12px var(--mono); color: var(--warn); }
  .toolbar button:hover { border-color: var(--dim); }
  .toolbar button.on { background: var(--sel); border-color: var(--warn); }

  /* branch bar */
  .branchbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 8px; border-bottom: 1px solid var(--line); font: 12px var(--mono); color: var(--dim); }
  .branchbar .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .branchbar .tabs button { padding: 1px 8px; background: none; border: 1px solid var(--line); cursor: pointer; font: 500 12px var(--mono); }
  .branchbar .tabs button.on { background: var(--sel); border-color: var(--level); color: var(--level); }
  .branchbar input { width: 7ch; padding: 1px 4px; background: var(--screen); border: 1px solid var(--line); font: 12px var(--mono); text-align: right; }
  .branchbar .info { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .branchbar .net { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .branchbar .net input { width: 12ch; text-align: left; }
  .lbl { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }

  /* node grid */
  .grid-wrap { min-height: 0; overflow: auto; }
  table.grid { border-collapse: collapse; min-width: 100%; font: 13px/1.3 var(--mono); font-variant-numeric: tabular-nums; }
  .grid th { position: sticky; top: 0; z-index: 1; padding: 5px 8px; background: var(--chrome); border-bottom: 1px solid var(--line); color: var(--dim); font: 500 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; text-align: right; white-space: nowrap; }
  .grid td { height: 24px; padding: 0 8px; border-bottom: 1px solid var(--line-soft); color: var(--level); text-align: right; white-space: nowrap; }
  .grid .l { text-align: left; }
  .grid td.node { color: var(--dim); }
  .grid td.edit { color: var(--text); }
  .grid tr.sel td { background: var(--sel); }
  .grid tr.sel td.node { color: var(--warn); }
  .grid input { width: 100%; box-sizing: border-box; padding: 3px 0; background: transparent; border: 0; outline: none; text-align: inherit; }
  .grid input:focus { background: rgb(255 209 102 / .1); box-shadow: inset 0 -2px 0 var(--warn); }
  .bad, .grid td.bad, .grid td.bad input { color: var(--bad); font-weight: 600; }
  .warn, .grid td.warn, .grid td.warn input { color: var(--warn); }
  .auto { color: var(--auto); }
  .ok { color: var(--auto); }

  /* node detail + status */
  .detail { display: grid; grid-template-columns: max-content 1fr; gap: 1px 16px; max-height: 30vh; overflow: auto; padding: 8px 10px; border-top: 1px solid var(--line); font: 12px/1.5 var(--mono); }
  .detail dt { color: var(--dim); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .detail dd { margin: 0; }
  .status { display: flex; flex-wrap: wrap; gap: 3px 16px; padding: 4px 8px; background: var(--chrome); border-top: 1px solid var(--line); font: 12px var(--mono); color: var(--dim); }
  .status .mode { color: var(--level); font-weight: 600; }
  .status .msg { color: var(--warn); }
  .status .hint { margin-left: auto; }

  /* dialogs */
  .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgb(2 6 18 / .72); }
  .dialog { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; width: min(1180px, 100%); max-height: 88vh; background: var(--chrome); border: 1px solid var(--line); box-shadow: 0 24px 60px rgb(0 0 0 / .6); }
  .dialog > header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .dialog h2 { margin: 0; font: 600 14px var(--sans); letter-spacing: .02em; }
  .dialog > header button { background: none; border: 0; font-size: 18px; line-height: 1; cursor: pointer; color: var(--dim); }
  .dialog-body { min-height: 0; overflow: auto; padding: 10px 12px; background: var(--screen); }
  .dialog > footer { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
  .btn { padding: 4px 12px; background: var(--chrome-hi); border: 1px solid var(--line); cursor: pointer; font-weight: 500; }
  .btn:hover { border-color: var(--dim); }
  .btn.primary { background: var(--warn); border-color: var(--warn); color: var(--on-warn); }
  .dialog p { max-width: 70ch; margin: 0 0 10px; }
  .scroll { overflow-x: auto; }
  table.report, table.spec { border-collapse: collapse; font: 12px var(--mono); font-variant-numeric: tabular-nums; }
  table.report th, table.spec th { padding: 4px 8px; color: var(--dim); font-weight: 500; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
  table.report td { padding: 3px 8px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  table.report tr.link { cursor: pointer; }
  table.report tr.link:hover td { background: var(--sel); }
  table.spec td { padding: 1px 2px; border-bottom: 1px solid var(--line-soft); }
  table.spec input { padding: 2px 4px; background: transparent; border: 1px solid transparent; font: 12px var(--mono); }
  table.spec input:focus { border-color: var(--warn); outline: none; }
  table.spec button.x { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 15px; }
  .spec-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .spec-tabs button { padding: 3px 12px; background: var(--chrome); border: 1px solid var(--line); cursor: pointer; }
  .spec-tabs button.on { border-color: var(--warn); color: var(--warn); }
  .params { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .params fieldset { margin: 0; padding: 8px 10px; border: 1px solid var(--line); }
  .params legend { padding: 0 4px; color: var(--warn); font-size: 12px; font-weight: 600; }
  .field { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 2px 0; font-size: 12px; }
  .field input:not([type="checkbox"]) { width: 12ch; padding: 2px 4px; background: var(--screen); border: 1px solid var(--line); font: 12px var(--mono); text-align: right; }
  .params .name input { width: 18ch; text-align: left; }
  .notation td:first-child { color: var(--level); }
  textarea.export { width: 100%; min-height: 40vh; box-sizing: border-box; background: var(--screen); color: var(--text); border: 1px solid var(--line); font: 12px var(--mono); }
  @media (prefers-reduced-motion: no-preference) { .toolbar button, .btn { transition: border-color .12s; } }
</style>

<div class="app" id="app">
  <header class="menubar">
    <span class="brand">HFC PLANT DESIGNER</span>
    <nav class="menus" id="menus" aria-label="Menu"></nav>
    <span class="doc" id="doc-name"></span>
  </header>
  <nav class="toolbar" id="toolbar" aria-label="Commands"></nav>
  <section class="branchbar" id="branchbar" aria-label="Branches"></section>
  <main class="grid-wrap">
    <table class="grid" id="grid"><thead></thead><tbody></tbody></table>
  </main>
  <dl class="detail" id="detail" aria-label="Selected node"></dl>
  <footer class="status" id="status" aria-live="polite"></footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header><h2 id="modal-title"></h2><button type="button" id="modal-close" aria-label="Close">×</button></header>
    <div class="dialog-body" id="modal-body"></div>
    <footer id="modal-foot"></footer>
  </div>
</div>
<input type="file" id="file-input" accept=".json,application/json" hidden>

<script src="specs.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
