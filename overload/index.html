<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Overload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Free, offline-first workout tracker. Log sets fast, see records, recovery and progress.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Overload">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div class="tab-root" data-tab="sets"></div>
    <div class="tab-root" data-tab="sessions" hidden></div>
    <div class="tab-root" data-tab="body" hidden></div>
    <div class="tab-root" data-tab="today" hidden></div>
    <div id="timerbar" class="timerbar"></div>
    <nav class="tabbar" aria-label="Tabs"></nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="sheets"></div>
    <div id="confetti" aria-hidden="true"></div>
  </div>
  <noscript>Overload needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
