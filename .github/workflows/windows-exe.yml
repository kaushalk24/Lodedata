# Builds LodeData.exe (the Design Assistant as a Windows program) on a
# Windows machine at every push, checks it, and publishes it as the
# "windows-latest" release: LodeData-windows.zip.
name: Windows program

on:
  push:
    branches: [claude/lode-data-reverse-engineer-65vgkc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check LodeData.exe
        shell: cmd
        run: desktop\build.bat
      - name: Start it as a user would, also as unzipped from a download
        shell: pwsh
        run: |
          # true when LodeData.exe stays open with its window and its page loads
          function Start-Check([string]$dir) {
            $log = "$env:LOCALAPPDATA/LodeData/lodedata.log"
            Remove-Item $log -ErrorAction SilentlyContinue
            $p = Start-Process "$dir/LodeData.exe" -PassThru
            Start-Sleep 20
            $ok = -not $p.HasExited
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "could not open" -Quiet)) { $ok = $false; Get-Content $log }
            if ($ok) {
              try { $ok = (Invoke-WebRequest http://127.0.0.1:17170/ -UseBasicParsing).Content -match "app.js" } catch { $ok = $false }
            }
            Stop-Process $p -Force -ErrorAction SilentlyContinue
            Start-Sleep 2
            return $ok
          }
          # what Windows does to files unzipped from an internet download; the
          # .exe itself the user lets run ("More info - Run anyway")
          function Mark-Downloaded([string]$dir) {
            Get-ChildItem $dir -Recurse -File | ForEach-Object {
              Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
            Remove-Item "$dir/LodeData.exe" -Stream Zone.Identifier
          }
          if (-not (Start-Check "dist/LodeData")) { throw "LodeData.exe did not open its window" }
          "as built: the window opened and the page loaded"

          # Without LodeData.exe.config such a copy cannot open its window:
          # "Failed to resolve Python.Runtime.Loader.Initialize" (run 3 of this
          # workflow showed it, as on the user's laptop).
          Copy-Item dist/LodeData "$env:RUNNER_TEMP/downloaded" -Recurse
          Mark-Downloaded "$env:RUNNER_TEMP/downloaded"
          if (-not (Start-Check "$env:RUNNER_TEMP/downloaded")) { throw "unzipped from a download, LodeData.exe did not open its window" }
          "downloaded, with LodeData.exe.config: the window opened and the page loaded"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/LodeData -DestinationPath LodeData-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LodeData-windows
          path: LodeData-windows.zip
      - name: Publish as the windows-latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create windows-latest LodeData-windows.zip --target $env:GITHUB_SHA --prerelease `
            --title "LodeData.exe (latest build)" `
            --notes "The Design Assistant as a Windows program, built from $env:GITHUB_SHA. Unzip, open the LodeData folder, double-click LodeData.exe."
