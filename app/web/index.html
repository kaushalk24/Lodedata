<title>Design Assistant</title>
<link rel="stylesheet" href="/style.css">

<div id="app">
  <div class="titlebar"><span class="ico">▣</span><span id="title">Design Assistant - Design - lode-1</span></div>

  <div class="menubar">
    <span class="mi" data-menu="file">File</span><span class="mi" data-menu="edit">Edit</span>
    <span class="mi" data-menu="mode">Mode</span><span class="mi" data-menu="tools">Tools</span>
    <span class="mi" data-menu="global">Global Change</span><span class="mi" data-menu="spec">Spec Edit</span>
    <span class="mi" data-menu="test">Test</span><span class="mi" data-menu="misc">Misc</span>
    <span class="mi" data-menu="reports">Reports</span><span class="mi" data-menu="view">View</span>
    <span class="mi" data-menu="help">Help</span>
  </div>

  <div class="toolbar">
    <button class="tb" id="tbNew" title="New network">🗋</button>
    <button class="tb" id="tbOpen" title="Open network">🗀</button>
    <button class="tb" id="tbSave" title="Save">🖫</button>
    <span class="sep"></span>
    <button class="tb" id="tbInsert" title="Insert node">✚</button>
    <button class="tb" id="tbDelete" title="Delete node">━</button>
    <span class="sep"></span>
    <label class="sel">EQ <select id="selEQ"><option>Auto</option><option>EQ+</option><option>EQ-</option><option>EQe</option></select></label>
    <label class="sel">OP <select id="selOP"><option>Off</option><option>OP+</option><option>OPf</option></select></label>
    <label class="sel">TSG <select id="selTSG"><option>1</option><option>2</option><option>3</option></select></label>
    <span class="spacer"></span>
    <label class="sel">Network <select id="selNet"></select></label>
    <label class="sel">Mode <select id="selMode">
      <option value="design">Design</option><option value="entry">Entry</option>
      <option value="power">Power</option></select></label>
  </div>

  <div class="screenmenu" id="screenmenu"></div>

  <div class="grid-wrap">
    <table class="grid" id="grid"><thead></thead><tbody></tbody></table>
    <div class="infopanel" id="info"></div>
  </div>

  <div class="statusbar">
    <span id="stSpecs">no specs</span>
    <span id="stMsg"></span>
    <span id="stBranch">Branch 1 of 1</span>
    <span id="stFeeder">Feeder 1.1</span>
    <span id="stMode">Import</span>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="modalbox" id="modalbox"></div></div>
<script src="/app.js"></script>
